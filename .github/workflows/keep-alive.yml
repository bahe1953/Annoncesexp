name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -I \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/")
          echo "Reponse HTTP : $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Projet actif, ping reussi."
          elif [ "$code" = "401" ] || [ "$code" = "404" ]; then
            echo "La base a repondu ($code) : active, mais verifie la cle/URL."
          else
            echo "Reponse inattendue ($code). Projet peut-etre en pause ou injoignable."
            exit 1
          fi
